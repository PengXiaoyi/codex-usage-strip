name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.3.0"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate tag and update keys
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$app_version" != "$tag_version" ]]; then
            echo "Tag $RELEASE_TAG does not match Info.plist version $app_version" >&2
            exit 1
          fi
          for secret_name in SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required secret: $secret_name" >&2
              exit 1
            fi
          done
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_owner="$(echo "$repository_owner" | tr '[:upper:]' '[:lower:]')"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
          echo "CODEX_USAGE_STRIP_UPDATE_FEED_URL=https://${repository_owner}.github.io/${repository_name}/appcast.xml" >> "$GITHUB_ENV"
          echo "SPARKLE_DOWNLOAD_URL_PREFIX=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" >> "$GITHUB_ENV"

      - name: Build ad-hoc signed release
        env:
          CODEX_USAGE_STRIP_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          ./scripts/package_release.sh
          ./.release/app/Codex\ Usage\ Strip.app/Contents/MacOS/CodexUsageStrip --self-test
          codesign --verify --deep --strict --verbose=2 ./.release/app/Codex\ Usage\ Strip.app

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make_appcast.sh

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            ".release/Codex-Usage-Strip-${APP_VERSION}-stable.dmg"
            ".release/updates/Codex-Usage-Strip-${APP_VERSION}-stable.zip"
            ".release/SHA256SUMS"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "Codex Usage Strip ${APP_VERSION}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Codex Usage Strip ${APP_VERSION}" \
              --draft \
              --generate-notes
          fi

      - name: Prepare update feed
        run: |
          mkdir -p .release/pages
          cp .release/appcast.xml .release/pages/appcast.xml

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .release/pages

  deploy-feed:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Sparkle feed
        id: deployment
        uses: actions/deploy-pages@v5

  publish-release:
    needs: deploy-feed
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
